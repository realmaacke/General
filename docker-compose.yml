volumes:
  # Media volumes
  plex-config: {}
  plex-media: {}
  overseerr-data: {}
  sonarr-data: {}
  radarr-data: {}
  # Monitor volumes

# Nginx should have all networks.
networks:
  net_general:
    driver: bridge
  net_media:
    driver: bridge
  net_engine:
    driver: bridge
  net_monitor:
    driver: bridge
  net_database:
    driver: bridge

include:
  # - compose_files/compose_media.yml
  - compose_files/compose_general.yml

services:
  # Reverse proxy
  nginx:
    build:
      context: "./proxy"
      dockerfile: Dockerfile
    volumes:
      - "./proxy/certs:/etc/letsencrypt"
      - "./proxy/certbot-webroot:/var/www/certbot"
      - "./proxy/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./proxy/sites:/etc/nginx/conf.d:ro"
      - "./proxy/configs:/etc/nginx/configs:ro"
      - "./scripts/nginx-entrypoint.sh:/entrypoint.sh"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - net_general
      - net_media
      - net_engine
      - net_monitor
      - net_database
    restart: unless-stopped